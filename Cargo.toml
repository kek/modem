[workspace]
resolver = "2"
members = ["modem-core", "modem-codec", "modem-audio", "modem-cli", "modem-ffi", "uniffi-bindgen"]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow      = "1"
clap        = { version = "4.5", features = ["derive"] }
cpal        = "0.15"
crc32fast   = "1.4"
hound       = "3.5"
proptest    = "1.5"
reed-solomon = "0.2"
rustfft     = "6.2"
sha2        = "0.10"
thiserror   = "1"
uniffi      = "0.28"
